AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BudgetTracker - ASP.NET Core API + React SPA (wwwroot) on a single Lambda behind a Function URL.
  Database is Neon Postgres. Secrets are read from SSM Parameter Store at cold start (see deploy/README.md).

# Runtime choice: Lambda has no managed .NET 9 zip runtime (managed .NET is 8 and 10; .NET 9 is container-image only).
# The app is therefore published self-contained for linux-arm64 with the executable named "bootstrap" and runs on
# the OS-only provided.al2023 runtime. Build the zip first (README step 3); `sam build` is not used.

Parameters:
  SsmParameterPath:
    Type: String
    Default: /budgettracker
    Description: SSM path prefix loaded into configuration at startup (/budgettracker/Plaid/Secret -> Plaid:Secret).
  AspNetCoreEnvironment:
    Type: String
    Default: Production
    AllowedValues: [Production, Staging]
    Description: Never Development here - it would expose the sandbox seed route and OpenAPI document.
  AlertEmail:
    Type: String
    Default: ''
    Description: >
      Address that gets the alarm and budget emails. Empty sends none (the alarms still show in CloudWatch).
      AWS emails a confirmation link after the deploy; nothing arrives until it is clicked.
  MonthlyBudgetUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Monthly AWS cost (USD) that triggers a budget email at 80% and 100%. 0 creates no budget.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasBudget: !Not [!Equals [!Ref MonthlyBudgetUsd, 0]]
  HasBudgetAndEmail: !And [!Condition HasAlertEmail, !Condition HasBudget]

Resources:
  BudgetTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: budgettracker
      Description: BudgetTracker API + SPA
      CodeUri: artifacts/budgettracker.zip
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 30
      # Lambda traces each invocation with X-Ray (duration, cold-start time). SAM adds the X-Ray write permissions to
      # the role. No X-Ray SDK is used in the app; each log line carries the trace ID as XRayTraceId instead.
      Tracing: Active
      Environment:
        Variables:
          ASPNETCORE_ENVIRONMENT: !Ref AspNetCoreEnvironment
          SsmParameterPath: !Ref SsmParameterPath
      # SAM adds both lambda:InvokeFunctionUrl and lambda:InvokeFunction (InvokedViaFunctionUrl) public
      # statements for AuthType NONE. Auth is enforced in the app (Cognito JWT on /api, Plaid JWT on the webhook).
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Sid: ReadBudgetTrackerParameters
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameters
                - ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}/*
      # Covers SecureStrings encrypted with the default aws/ssm key. A customer-managed KMS key would also need kms:Decrypt.

  BudgetTrackerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${BudgetTrackerFunction}
      RetentionInDays: 14

  # Saved CloudWatch Logs Insights queries (Logs Insights > Saved queries > BudgetTracker). They read the JSON log
  # lines the app writes: top-level EventId / LogLevel / Category / Message, the message's fields under State.*, and
  # the request scope (CorrelationId, UserId, XRayTraceId). Event IDs are catalogued in
  # BudgetTracker.Server/Utilities/Observability/*Log.cs; a test fails if a query names one that no longer exists.
  FindRequestQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: BudgetTracker/Find a request by correlation ID
      LogGroupNames:
        - !Ref BudgetTrackerLogGroup
      QueryString: |
        # Replace PASTE-CORRELATION-ID with the X-Correlation-ID from the browser console or an error response.
        fields @timestamp, LogLevel, EventId, Category, Message
        | filter @message like /"CorrelationId":"PASTE-CORRELATION-ID"/
        | sort @timestamp asc

  WarningsAndErrorsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: BudgetTracker/Warnings and errors
      LogGroupNames:
        - !Ref BudgetTrackerLogGroup
      QueryString: |
        fields @timestamp, LogLevel, EventId, Category, Message
        | filter LogLevel in ["Warning", "Error", "Critical"]
        | sort @timestamp desc
        | limit 200

  UnhandledExceptionsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: BudgetTracker/Unhandled exceptions
      LogGroupNames:
        - !Ref BudgetTrackerLogGroup
      QueryString: |
        fields @timestamp, State.ExceptionType, State.Method, State.Path, State.StackTrace
        | filter EventId = 1004
        | sort @timestamp desc
        | limit 100

  SecurityEventsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: BudgetTracker/Security events
      LogGroupNames:
        - !Ref BudgetTrackerLogGroup
      QueryString: |
        # Failed sign-ins (1001) and denied requests (1002), per hour. A spike is the signal.
        filter Category = "BudgetTracker.Security"
        | stats count() as events by bin(1h), EventId, State.StatusCode
        | sort events desc

  SlowDatabaseCommandsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: BudgetTracker/Slow database commands
      LogGroupNames:
        - !Ref BudgetTrackerLogGroup
      QueryString: |
        filter EventId = 1006
        | stats count() as times, avg(State.DurationMs) as avgMs, max(State.DurationMs) as maxMs by State.Statement, State.Tables
        | sort times desc

  PlaidSyncOutcomesQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: BudgetTracker/Plaid sync outcomes
      LogGroupNames:
        - !Ref BudgetTrackerLogGroup
      QueryString: |
        filter EventId = 2017
        | stats count() as syncs, avg(State.DurationMs) as avgMs, max(State.DurationMs) as maxMs, sum(State.Inserted) as inserted, sum(State.Updated) as updated, sum(State.Removed) as removed by State.Outcome
        | sort syncs desc

  WebullSyncOutcomesQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: BudgetTracker/Webull sync outcomes
      LogGroupNames:
        - !Ref BudgetTrackerLogGroup
      QueryString: |
        # 3005 = order-history sync, 3006 = portfolio fetch.
        filter EventId in [3005, 3006]
        | stats count() as runs, avg(State.DurationMs) as avgMs, max(State.DurationMs) as maxMs by EventId, State.Outcome
        | sort runs desc

  # Email alerts (project-docs/observability.md). Single user, so one email per incident is the right volume:
  # each alarm fires on the first occurrence in a 5-minute window and emails again only after recovering.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: budgettracker-alerts
      DisplayName: BudgetTracker alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Invocations that crashed or timed out (also the scheduled Webull close snapshot). A handled 500 still
  # completes the invocation, so it is counted by ServerErrorsAlarm instead.
  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: budgettracker-function-errors
      AlarmDescription: The Lambda crashed or timed out. Find the request with the "Warnings and errors" saved query.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BudgetTrackerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Every 500 response logs event 1004 (ObservabilityLog.UnhandledException), so this counts server errors from
  # the app's own logs rather than from Function URL metrics.
  ServerErrorsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BudgetTrackerLogGroup
      FilterPattern: '{ $.EventId = 1004 }'
      MetricTransformations:
        - MetricNamespace: BudgetTracker
          MetricName: UnhandledExceptions
          MetricValue: '1'
          DefaultValue: 0

  ServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: budgettracker-server-errors
      AlarmDescription: A request failed with an unhandled exception (HTTP 500). See the "Unhandled exceptions" saved query.
      Namespace: BudgetTracker
      MetricName: UnhandledExceptions
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Catches runaway cost from a bug or from abuse of the public Function URL. Account-wide, not just this stack.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetAndEmail
    Properties:
      Budget:
        BudgetName: budgettracker-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  FunctionUrl:
    Description: Public URL of the app. Set /budgettracker/Plaid/WebhookUrl to <this>api/plaid/webhook.
    Value: !GetAtt BudgetTrackerFunctionUrl.FunctionUrl
  FunctionName:
    Description: Lambda function name
    Value: !Ref BudgetTrackerFunction
