version: 2
updates:
  - package-ecosystem: npm
    directory: /budgettracker.client
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: monthly
