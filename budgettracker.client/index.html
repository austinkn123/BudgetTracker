<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>budgettracker.client</title>
    <script>
      // Theme bootstrap (BUD-17). Runs before first paint so a dark-mode user
      // never sees a white flash. Mirrors shared/theme/theme.ts — keep the
      // storage key and the resolution rule in step with it.
      (function () {
        try {
          var stored = window.localStorage.getItem('bud-theme');
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          // Blocked storage or no matchMedia — fall through to the light default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
